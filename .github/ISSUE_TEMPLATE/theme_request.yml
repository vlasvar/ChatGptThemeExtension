name: Theme proposal
description: Propose an original community theme
title: "[Theme]: "
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Concept and palette
      description: Describe the visual direction and how it keeps the interface readable.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Artwork rights
      options:
        - label: I created the artwork or have permission to contribute it under this project's license.
          required: true
