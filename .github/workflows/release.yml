name: Package release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Build installable archive
        run: |
          zip -r skinshift-${GITHUB_REF_NAME}.zip \
            manifest.json assets content popup themes \
            -x 'themes/schema.json'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" skinshift-${GITHUB_REF_NAME}.zip --generate-notes
