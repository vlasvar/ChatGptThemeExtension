<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkinShift</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="../assets/icon128.png" alt="" width="36" height="36">
      <div>
        <h1>SkinShift</h1>
        <p>Make ChatGPT yours.</p>
      </div>
      <label class="switch" aria-label="Enable SkinShift">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <main>
      <p class="eyebrow">Choose a theme</p>
      <div id="themes" class="themes" aria-live="polite"></div>
      <label class="mode-picker" for="sidebarMode">
        <span>
          <strong>Sidebar appearance</strong>
          <small>Choose the smoother wallpaper-only mode or add marks to Projects and Pinned.</small>
        </span>
        <select id="sidebarMode">
          <option value="wallpaper">Wallpaper only</option>
          <option value="marks">Icons + wallpaper</option>
        </select>
      </label>
      <section id="sidebarMarks" class="sidebar-marks" aria-live="polite">
        <div class="group-heading"><span>Projects</span><em id="projectCount">0</em></div>
        <div id="projects" class="project-list"></div>
        <div class="group-heading"><span>Pinned</span><em id="pinnedCount">0</em></div>
        <div id="pinned" class="project-list"></div>
      </section>
      <p id="status" class="status" role="status"></p>
    </main>

    <footer>
      <span>Local-only · No tracking</span>
      <span class="footer-links">
        <a href="https://github.com/vlasvar/skinshift/blob/main/CONTRIBUTING.md" target="_blank" rel="noreferrer">Make a theme ↗</a>
        <a href="https://aislop.gr" target="_blank" rel="noreferrer">aislop.gr ↗</a>
      </span>
    </footer>

    <template id="theme-template">
      <button class="theme-card" type="button">
        <span class="theme-preview"></span>
        <span class="theme-copy">
          <strong></strong>
          <small></small>
        </span>
        <span class="check" aria-hidden="true">✓</span>
      </button>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
